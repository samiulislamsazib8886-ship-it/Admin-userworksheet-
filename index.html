<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Secure Backup Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #0f9d58; --bg: #f8f9fa; --border: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; font-weight: bold; }
        body { background: var(--bg); padding: 10px; }
        header { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; display: flex; justify-content: space-between; }
        .tab-bar { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; }
        .tab { padding: 10px 20px; background: white; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--primary); color: white; }
        .sheet { background: white; border-radius: 8px; overflow: auto; border: 1px solid var(--border); max-height: 50vh; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; table-layout: fixed; }
        th { background: #f1f3f4; border: 1px solid var(--border); padding: 8px; font-size: 11px; position: sticky; top: 0; z-index: 10; }
        td { border: 1px solid var(--border); padding: 0; height: 32px; }
        .cell { width: 100%; height: 100%; border: none; padding: 5px; font-size: 11px; outline: none; background: transparent; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; }
        .backup-section { background: #fff3e0; padding: 10px; border-radius: 8px; border: 1px solid #ffe0b2; }
    </style>
</head>
<body>

    <header>
        <div style="color:var(--primary); font-size: 20px;">MASTER ADMIN CONTROL</div>
        <div>
            <button class="btn" style="background:#333;" onclick="addUser()">+ Add User</button>
            <button class="btn" style="background:#1a73e8;" onclick="addRow()">+ Add Row</button>
            <button class="btn" style="background:#ef4444;" onclick="deleteUser()">Delete Active User</button>
        </div>
    </header>

    <div id="tabs" class="tab-bar"></div>

    <!-- মেইন শিট -->
    <div class="sheet">
        <h4 style="padding: 10px; color: #555;">ACTIVE DATA</h4>
        <table>
            <thead>
                <tr><th style="width:40px;">#</th><th style="width:130px;">UID</th><th style="width:130px;">PASSWORD</th><th style="width:130px;">2FA KEY</th><th style="width:130px;">COOKIE</th><th>FULL MAIL</th><th style="width:100px;">STATUS</th><th style="width:40px;">X</th></tr>
            </thead>
            <tbody id="sheet-body"></tbody>
        </table>
    </div>

    <!-- ব্যাকআপ সেকশন -->
    <div class="backup-section">
        <h4 style="color: #e65100;"><i class="fa-solid fa-clock-rotate-left"></i> DELETED DATA BACKUP (Recycle Bin)</h4>
        <div class="sheet" style="max-height: 30vh; margin-top: 10px;">
            <table style="min-width: 1000px;">
                <thead>
                    <tr><th style="width:150px;">Time</th><th style="width:130px;">UID</th><th style="width:130px;">Pass</th><th style="width:130px;">2FA</th><th>Full Mail</th><th style="width:100px;">Restore</th></tr>
                </thead>
                <tbody id="backup-body"></tbody>
            </table>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAWe-hm45aoVdAuGajFP2aWUrXbWah29B0",
        authDomain: "user-sheet-control.firebaseapp.com",
        databaseURL: "https://user-sheet-control-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "user-sheet-control",
        storageBucket: "user-sheet-control.firebasestorage.app",
        messagingSenderId: "1003962005887",
        appId: "1:1003962005887:web:cc9048bc5d1413449a024a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentTab = "";

    function loadTabs() {
        db.ref('users').on('value', snap => {
            let html = ''; snap.forEach(c => {
                let name = c.key; if(!currentTab) currentTab = name;
                html += `<div class="tab ${name===currentTab?'active':''}" onclick="changeTab('${name}')">${name}</div>`;
            });
            document.getElementById('tabs').innerHTML = html;
            loadRows(); loadBackups();
        });
    }

    function changeTab(name) { currentTab = name; loadTabs(); }

    function loadRows() {
        db.ref('data/' + currentTab).on('value', snap => {
            let html = ''; let i = 1;
            snap.forEach(c => {
                let r = c.val(); let k = c.key;
                html += `<tr><td style="text-align:center;">${i}</td>
                    <td><input class="cell" value="${r.uid||''}" onchange="up('${k}','uid',this.value)"></td>
                    <td><input class="cell" value="${r.pass||''}" onchange="up('${k}','pass',this.value)"></td>
                    <td><input class="cell" value="${r.tfa||''}" onchange="up('${k}','tfa',this.value)"></td>
                    <td><input class="cell" value="${r.cookie||''}" onchange="up('${k}','cookie',this.value)"></td>
                    <td><input class="cell" value="${r.fullMail||''}" onchange="up('${k}','fullMail',this.value)"></td>
                    <td><input class="cell" value="${r.status||''}" onchange="up('${k}','status',this.value)"></td>
                    <td style="text-align:center;"><i class="fa-solid fa-trash" style="color:red; cursor:pointer;" onclick="del('${k}')"></i></td>
                </tr>`; i++;
            });
            document.getElementById('sheet-body').innerHTML = html;
        });
    }

    function loadBackups() {
        db.ref('backups/' + currentTab).on('value', snap => {
            let html = ''; snap.forEach(c => {
                let r = c.val(); let k = c.key;
                html += `<tr style="background:#fff9f0"><td>${k.split('T')[1].substring(0,8)}</td><td>${r.uid||''}</td><td>${r.pass||''}</td><td>${r.tfa||''}</td><td>${r.fullMail||''}</td>
                    <td><button style="background:green; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer;" onclick="restore('${k}')">Restore</button></td></tr>`;
            });
            document.getElementById('backup-body').innerHTML = html;
        });
    }

    function up(id, f, v) { db.ref(`data/${currentTab}/${id}`).update({[f]:v}); }
    function del(id) { if(confirm("Delete active row?")) db.ref(`data/${currentTab}/${id}`).remove(); }
    function restore(bkId) {
        db.ref(`backups/${currentTab}/${bkId}`).once('value', snap => {
            let data = snap.val();
            db.ref(`data/${currentTab}`).push(data).then(() => db.ref(`backups/${currentTab}/${bkId}`).remove());
        });
    }
    function addRow() { db.ref(`data/${currentTab}`).push({uid:"", pass:"", tfa:"", cookie:"", fullMail:"", status:"", color:"#ffffff"}); }
    function addUser() { let n = prompt("Name:"); if(n) db.ref('users/'+n).set({color:"#4f46e5"}); }
    function deleteUser() { if(confirm("DANGER: Delete user?")) { db.ref('users/'+currentTab).remove(); db.ref('data/'+currentTab).remove(); currentTab=""; } }
    
    window.onload = loadTabs;
</script>
</body>
</html>
